title: AQLT
author: Alain Quartier-la-Tente
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    common:
      slide-level: 3
      filters:
        - aqlt.lua
    beamer:
      theme: aqlt
      pdf-engine: pdflatex
      fontsize: 10pt
      section-titles: false
      classoption:
        - xcolor=table
        - dvipsnames
      include-in-header:
        - preambule.tex
      template-partials:
        - before-body.tex
        - toc.tex
      format-resources:
        - beamerthemeaqlt.sty
    revealjs:
      theme: [default, aqlt.scss]
      template-partials:
        - title-slide.html
      slide-number: c/t
      show-slide-number: all
      width: 1280
      height: 720
      center: false
      transition: none
